# ============================================================
# Reverse proxy unico da stack MeasureSoftGram-Platform.
# Copia do deploy/nginx/default.conf do Service + location /health/
# extra para o smoke test. Uma URL so: http://localhost
#
# service/front/grafana sao opcionais (COMPOSE_PROFILES) — por isso os
# upstreams usam $variavel + resolver do Docker (127.0.0.11) em vez de
# blocos `upstream {}`: assim o nginx sobe mesmo com algum backend
# desligado (a rota dele responde 502 em vez de derrubar o proxy inteiro).
# ============================================================

resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # next dev/gunicorn --reload podem demorar na 1a compilacao.
    proxy_connect_timeout 300s;
    proxy_read_timeout 300s;

    # Health do backend, exposto na borda para o smoke-test.
    location = /health/ {
        set $service_upstream service:8080;
        proxy_pass http://$service_upstream;
        proxy_set_header Host $host;
    }

    # --- Backend Django (DRF) ---
    location /api/ {
        set $service_upstream service:8080;
        proxy_pass http://$service_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /swagger/ {
        set $service_upstream service:8080;
        proxy_pass http://$service_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        set $service_upstream service:8080;
        proxy_pass http://$service_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        set $service_upstream service:8080;
        proxy_pass http://$service_upstream;
        proxy_set_header Host $host;
    }

    # --- Grafana (subpath /grafana) ---
    location /grafana/ {
        set $grafana_upstream grafana:3000;
        proxy_pass http://$grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Frontend (Next.js dev server, com HMR) ---
    location / {
        set $front_upstream front:3000;
        proxy_pass http://$front_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # websocket do HMR (webpack-dev-server)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
