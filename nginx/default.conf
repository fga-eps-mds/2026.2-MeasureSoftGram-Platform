# ============================================================
# Reverse proxy unico da stack MeasureSoftGram-Platform.
# Copia do deploy/nginx/default.conf do Service + location /health/
# extra para o smoke test. Uma URL so: http://localhost
# ============================================================

upstream msgram_service {
    server service:8080;
}

upstream msgram_front {
    server front:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # Health do backend, exposto na borda para o smoke-test.
    location = /health/ {
        proxy_pass http://msgram_service;
        proxy_set_header Host $host;
    }

    # --- Backend Django (DRF) ---
    location /api/ {
        proxy_pass http://msgram_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /swagger/ {
        proxy_pass http://msgram_service;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://msgram_service;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://msgram_service;
        proxy_set_header Host $host;
    }

    # --- Grafana (subpath /grafana) ---
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Frontend (Next.js) ---
    location / {
        proxy_pass http://msgram_front;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
