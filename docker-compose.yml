# ============================================================
# MeasureSoftGram-Platform — sobe o produto inteiro a partir do
# codigo dos submodulos, atras de um proxy nginx unico na :80.
#
#   docker compose --env-file .env up -d --build
#
# Fonte unica de configuracao: .env na raiz (copie de .env.example).
# Perfis: db/service/front/grafana/proxy sobem por padrao;
#         cli e action ficam no profile "tools".
# ============================================================

volumes:
  service_postgres_data:
  grafana_data:

networks:
  msgram:
    driver: bridge

services:
  db:
    container_name: db          # NOME OBRIGATORIO: datasource do Grafana tem "url: db:5432" hardcoded
    image: postgres:18-alpine
    volumes:
      # postgres 18+ guarda os dados em subdir version-specific e exige o mount na raiz
      - service_postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [msgram]
    restart: unless-stopped

  service:
    container_name: service
    build:
      context: ./MeasureSoftGram-Service
      dockerfile: Dockerfile
    # start_service.sh: wait-for-postgres -> migrate -> load_initial_data -> collectstatic -> gunicorn
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-TRUE}
      CREATE_FAKE_DATA: ${CREATE_FAKE_DATA:-TRUE}
      AMBIENT_TEST_OR_DEV: ${AMBIENT_TEST_OR_DEV:-TRUE}
      RUN_LOAD_INITIAL_DATA: ${RUN_LOAD_INITIAL_DATA:-true}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-admin}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@admin.com}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-admin}
      # dono dos dados fake do seed — so ficam visiveis p/ membros da org.
      # Ponha aqui o SEU login do GitHub para ve-los ao "Entrar com GitHub".
      SEED_GITHUB_USERNAME: ${SEED_GITHUB_USERNAME:-msgramteste}
      SEED_GITHUB_EMAIL: ${SEED_GITHUB_EMAIL:-msgram.teste@gmail.com}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,service,proxy}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      FRONTEND_DEV_URL: ${FRONTEND_DEV_URL:-http://localhost}
      FRONTEND_PROD_URL: ${FRONTEND_PROD_URL:-http://localhost}
      LOGIN_REDIRECT_URL: ${LOGIN_REDIRECT_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_SECRET: ${GITHUB_SECRET}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      GRAFANA_BASE_URL: ${GRAFANA_BASE_URL:-http://grafana:3000}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-http://localhost/grafana}
      GRAFANA_USERNAME: ${GRAFANA_USERNAME:-admin}
      GRAFANA_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [msgram]
    restart: unless-stopped

  front:
    container_name: front
    build:
      context: ./MeasureSoftGram-Front
      # variaveis do Front sao BUILD-TIME (Next 12 inlina NEXT_PUBLIC_* e o bloco env).
      # Alterou? -> docker compose build front
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
        SERVICE_URL: ${SERVICE_URL:-http://service:8080/api}
        LOGIN_REDIRECT_URL: ${LOGIN_REDIRECT_URL}
        GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
    # SEM bind mount: o compose de dev do Front monta .:/usr/src e apaga o build de producao
    depends_on:
      service:
        condition: service_healthy
    networks: [msgram]
    restart: unless-stopped

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    volumes:
      - grafana_data:/var/lib/grafana
      - ./MeasureSoftGram-Service/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./MeasureSoftGram-Service/grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      GF_SERVER_ROOT_URL: '%(protocol)s://%(domain)s/grafana'
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USERNAME:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_INSTALL_PLUGINS: volkovlabs-echarts-panel
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: volkovlabs-echarts-panel
    depends_on:
      db:
        condition: service_healthy
    networks: [msgram]
    restart: unless-stopped

  proxy:
    container_name: proxy
    image: nginx:1.27-alpine
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - service
      - front
      - grafana
    networks: [msgram]
    restart: unless-stopped

  cli:
    build:
      context: .
      dockerfile: docker/cli/Dockerfile
    profiles: ["tools"]
    environment:
      LOG: ${LOG:-verbose}
    volumes:
      - ./workspace:/workspace
    entrypoint: ["msgram"]
    networks: [msgram]

  action:
    build:
      context: ./MeasureSoftGram-Action
    profiles: ["tools"]
    environment:
      MSGRAM_SERVICE_HOST: ${MSGRAM_SERVICE_HOST:-http://service:8080}
      MSGRAM_TOKEN: ${MSGRAM_TOKEN}
      SONAR_TOKEN: ${SONAR_TOKEN}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./MeasureSoftGram-Action:/workspace
    networks: [msgram]
