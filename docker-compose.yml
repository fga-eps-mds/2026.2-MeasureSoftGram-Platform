# ============================================================
# MeasureSoftGram-Platform — sobe o produto a partir do codigo dos
# submodulos, em modo DEV (hot reload), atras de um proxy nginx unico
# na :80.
#
#   docker compose up -d
#
# Fonte unica de configuracao: .env na raiz (copie de .env.example).
# Voce escolhe o que sobe pela variavel COMPOSE_PROFILES do .env
# (ou rode `make select` para um menu interativo). Profiles:
#   service  -> API Django (+ db, + proxy)            [hot reload]
#   front    -> Next.js (+ service, db, proxy)        [hot reload]
#   grafana  -> Dashboards (+ db, proxy)
#   ai       -> Servidor MCP + inspector (+ service, db) [hot reload]
#   docs     -> Site de documentacao (Docusaurus)      [hot reload]
#   tools    -> cli / action / plugin (containers utilitarios, `docker
#               compose run --rm <servico>`, nao sobem com `up`)
# ============================================================

volumes:
  service_postgres_data:
  grafana_data:
  front_node_modules:
  front_next_cache:
  docs_node_modules:

networks:
  msgram:
    driver: bridge

services:
  db:
    container_name: db          # NOME OBRIGATORIO: datasource do Grafana tem "url: db:5432" hardcoded
    image: postgres:18-alpine
    volumes:
      # postgres 18+ guarda os dados em subdir version-specific e exige o mount na raiz
      - service_postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["service", "front", "grafana", "ai"]
    networks: [msgram]
    restart: unless-stopped

  service:
    container_name: service
    build:
      context: ./MeasureSoftGram-Service
      dockerfile: Dockerfile.dev
    # O Dockerfile.dev do submodulo so roda `manage.py runserver` (sem migrar
    # nem semear o banco) — dev-entrypoint.sh (deste repo, nao do submodulo)
    # refaz esse setup e termina com `runserver`: reload nativo do Django ao
    # salvar um arquivo em src/, sem flags/engine de terceiros.
    command: ["bash", "/dev-entrypoint.sh"]
    volumes:
      - ./MeasureSoftGram-Service/src:/src
      - ./docker/service/dev-entrypoint.sh:/dev-entrypoint.sh:ro
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-TRUE}
      CREATE_FAKE_DATA: ${CREATE_FAKE_DATA:-TRUE}
      AMBIENT_TEST_OR_DEV: ${AMBIENT_TEST_OR_DEV:-TRUE}
      RUN_LOAD_INITIAL_DATA: ${RUN_LOAD_INITIAL_DATA:-true}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-admin}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@admin.com}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-admin}
      # dono dos dados fake do seed — so ficam visiveis p/ membros da org.
      # Ponha aqui o SEU login do GitHub para ve-los ao "Entrar com GitHub".
      SEED_GITHUB_USERNAME: ${SEED_GITHUB_USERNAME:-msgramteste}
      SEED_GITHUB_EMAIL: ${SEED_GITHUB_EMAIL:-msgram.teste@gmail.com}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,service,proxy}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      FRONTEND_DEV_URL: ${FRONTEND_DEV_URL:-http://localhost}
      FRONTEND_PROD_URL: ${FRONTEND_PROD_URL:-http://localhost}
      LOGIN_REDIRECT_URL: ${LOGIN_REDIRECT_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_SECRET: ${GITHUB_SECRET}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      GRAFANA_BASE_URL: ${GRAFANA_BASE_URL:-http://grafana:3000}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-http://localhost/grafana}
      GRAFANA_USERNAME: ${GRAFANA_USERNAME:-admin}
      GRAFANA_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    profiles: ["service", "front", "ai"]
    networks: [msgram]
    restart: unless-stopped

  front:
    container_name: front
    image: node:20-alpine
    working_dir: /usr/src
    # sem Dockerfile de producao: instala deps e roda `next dev` (HMR) toda
    # vez que o container sobe. As vars NEXT_PUBLIC_*/GITHUB_CLIENT_ID sao
    # lidas em runtime pelo `next dev` (nao precisa rebuild, so restart).
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev"
    volumes:
      - ./MeasureSoftGram-Front:/usr/src
      - front_node_modules:/usr/src/node_modules
      - front_next_cache:/usr/src/.next
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
      SERVICE_URL: ${SERVICE_URL:-http://service:8080/api}
      LOGIN_REDIRECT_URL: ${LOGIN_REDIRECT_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      service:
        condition: service_healthy
    profiles: ["front"]
    networks: [msgram]
    restart: unless-stopped

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    volumes:
      - grafana_data:/var/lib/grafana
      - ./MeasureSoftGram-Service/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./MeasureSoftGram-Service/grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      GF_SERVER_ROOT_URL: '%(protocol)s://%(domain)s/grafana'
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USERNAME:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_INSTALL_PLUGINS: volkovlabs-echarts-panel
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: volkovlabs-echarts-panel
    depends_on:
      db:
        condition: service_healthy
    profiles: ["grafana"]
    networks: [msgram]
    restart: unless-stopped

  proxy:
    container_name: proxy
    image: nginx:1.27-alpine
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # sem depends_on: service/front/grafana sao opcionais (profiles); o
    # default.conf resolve os upstreams em runtime e devolve 502 na rota
    # de um backend que nao esta no ar, em vez de o proxy falhar ao subir.
    profiles: ["service", "front", "grafana"]
    networks: [msgram]
    restart: unless-stopped

  cli:
    build:
      context: .
      dockerfile: docker/cli/Dockerfile
    profiles: ["tools"]
    environment:
      LOG: ${LOG:-verbose}
    volumes:
      - ./workspace:/workspace
      # pip install -e no Dockerfile: com o codigo montado por cima, editar
      # Core/Parser/CLI vale na hora, sem rebuild da imagem.
      - ./MeasureSoftGram-Core:/src/core
      - ./MeasureSoftGram-Parser:/src/parser
      - ./MeasureSoftGram-CLI:/src/cli
    entrypoint: ["msgram"]
    networks: [msgram]

  action:
    build:
      context: ./MeasureSoftGram-Action
    profiles: ["tools"]
    environment:
      MSGRAM_SERVICE_HOST: ${MSGRAM_SERVICE_HOST:-http://service:8080}
      MSGRAM_TOKEN: ${MSGRAM_TOKEN}
      SONAR_TOKEN: ${SONAR_TOKEN}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./MeasureSoftGram-Action:/workspace
    networks: [msgram]

  # ---- Plugin do VS Code (profile tools) ----
  # Nao e um servico: container util para `npm install` / testes / empacotar o
  # .vsix sem exigir Node na maquina do aluno. O desenvolvimento com hot
  # reload do Plugin e feito no VS Code (F5), nao neste container.
  #   docker compose run --rm plugin npm install
  plugin:
    image: node:20
    profiles: ["tools"]
    working_dir: /plugin
    volumes:
      - ./MeasureSoftGram-Plugin:/plugin
    networks: [msgram]

  # ---- Servidor MCP / AI (profile ai) ----
  # Expoe os dados do Service como ferramentas para LLMs.
  #   make select   ->   marque "ai"   ->   docker compose up -d
  ai:
    container_name: ai
    build:
      context: ./MeasureSoftGram-AI
      target: dev            # stage "dev" do Dockerfile ja roda watchfiles
    volumes:
      - ./MeasureSoftGram-AI:/app
    environment:
      SERVICE: ${SERVICE:-http://service:8080/api/v1/}
      MSGRAM_USER: ${MSGRAM_USER:-admin}
      MSGRAM_PASSWORD: ${MSGRAM_PASSWORD:-admin}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-streamable-http}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "${MCP_PORT:-8000}:8000"
    depends_on:
      service:
        condition: service_healthy
    profiles: ["ai"]
    networks: [msgram]
    restart: unless-stopped

  # Cliente web para inspecionar o MCP sem plugar um cliente real.
  #   http://localhost:6274
  mcp-inspector:
    image: node:20-slim
    working_dir: /app
    command: sh -c "HOST=0.0.0.0 npx --yes @modelcontextprotocol/inspector"
    ports:
      - "${MCP_INSPECTOR_PORT:-6274}:6274"
      - "6277:6277"
    depends_on:
      - ai
    profiles: ["ai"]
    networks: [msgram]

  # ---- Documentacao (profile docs) ----
  # Site Docusaurus do submodulo MeasureSoftGram-DOC, servido com hot reload.
  #   make select   ->   marque "docs"   ->   http://localhost:3001
  docs:
    image: node:20
    working_dir: /app
    command: sh -c "npm ci && npx docusaurus start --host 0.0.0.0 --port 3001 --poll 1000"
    volumes:
      - ./MeasureSoftGram-DOC:/app
      - docs_node_modules:/app/node_modules
    ports:
      - "${DOCS_PORT:-3001}:3001"
    profiles: ["docs"]
    networks: [msgram]
