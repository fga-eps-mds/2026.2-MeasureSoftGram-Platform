name: e2e-system

# E2E de sistema: Front buildado + Service + Postgres reais + fake-gitlab (docker-compose.e2e.yml),
# com a suite Playwright de e2e/. Roda contra a develop do Front e do Service, ou contra os refs recebidos:
# o Front e o Service chamam este workflow (workflow_call) a cada merge na develop deles.
on:
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * *" # 03:00 em Brasília
  workflow_dispatch:
    inputs:
      front_ref:
        description: Branch ou commit do Front
        type: string
        default: develop
      service_ref:
        description: Branch ou commit do Service
        type: string
        default: develop
  workflow_call:
    inputs:
      front_ref:
        type: string
        default: develop
      service_ref:
        type: string
        default: develop

# github.repository: a chamada do Front não cancela a do Service (nem a do Platform)
concurrency:
  group: e2e-system-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DC: docker compose -p msgram-e2e -f docker-compose.yml -f docker-compose.e2e.yml --profile front
    steps:
      # chamado por outro repositório, o checkout padrão pegaria o repositório de quem chamou
      - uses: actions/checkout@v4
        with:
          repository: fga-eps-mds/2026.2-MeasureSoftGram-Platform
          ref: ${{ github.repository == 'fga-eps-mds/2026.2-MeasureSoftGram-Platform' && github.ref || 'main' }}

      # só os dois submódulos que a stack usa, no ref pedido (sem entrada, na develop de cada um)
      - name: Submódulos Front e Service
        env:
          FRONT_REF: ${{ inputs.front_ref || 'develop' }}
          SERVICE_REF: ${{ inputs.service_ref || 'develop' }}
        run: |
          git submodule update --init MeasureSoftGram-Front MeasureSoftGram-Service
          git -C MeasureSoftGram-Front fetch origin "$FRONT_REF" && git -C MeasureSoftGram-Front checkout FETCH_HEAD
          git -C MeasureSoftGram-Service fetch origin "$SERVICE_REF" && git -C MeasureSoftGram-Service checkout FETCH_HEAD
          git submodule status MeasureSoftGram-Front MeasureSoftGram-Service

      - name: Up (build + espera ficar saudável)
        run: $DC up -d --build --wait --wait-timeout 600

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-system-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

      - name: Logs (em caso de falha)
        if: failure()
        run: $DC logs --no-color

      - name: Down
        if: always()
        run: $DC down -v
