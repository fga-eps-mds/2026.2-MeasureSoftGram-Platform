name: compose-smoke

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # os 2026.2-MeasureSoftGram-* sao publicos na mesma org. Se algum
          # virar privado, adicione `token:` com um PAT que os enxergue.
          submodules: recursive

      - name: Preparar .env
        run: cp .env.example .env

      - name: Build
        run: docker compose build

      - name: Up (service, front, grafana — perfis default do .env.example)
        run: docker compose up -d

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      - name: Logs (em caso de falha)
        if: failure()
        run: docker compose logs --no-color

      - name: Down
        if: always()
        run: docker compose down -v
