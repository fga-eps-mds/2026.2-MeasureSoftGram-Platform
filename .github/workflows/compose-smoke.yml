name: compose-smoke

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # os 2026.2-MeasureSoftGram-* sao publicos na mesma org. Se algum
          # virar privado, adicione `token:` com um PAT que os enxergue.
          submodules: recursive

      - name: Preparar .env
        # o migrate do Service exige uma chave Fernet; no CI basta uma descartavel
        run: |
          cp .env.example .env
          echo "GITHUB_TOKEN_ENCRYPTION_KEYS=$(python3 -c 'import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> .env

      - name: Build
        run: docker compose build

      - name: Up (service, front — perfis default do .env.example)
        run: docker compose up -d

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      - name: Logs (em caso de falha)
        if: failure()
        run: docker compose logs --no-color

      - name: Down
        if: always()
        run: docker compose down -v
